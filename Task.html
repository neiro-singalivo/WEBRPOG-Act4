<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="Styling.css" />
  </head>
  <body class="defaultbg">
    <div class="phone-frame">
      <div class="phone-screen">
        <h1
          style="
            color: white;
            margin-top: 20px;
            margin-left: 20px;
            font-size: 25px;
          "
        >
          Task List
        </h1>
        <button
          type="button"
          class="btn btn-primary"
          style="
            background-color: #2f6fb0;
            border-radius: 30px;
            height: 40px;
            width: 50px;
            font-size: 12px;
            margin-left: 15px;
            margin-top: 10px;
          "
        >
          All
        </button>

        <!-- Task list -->
        <section class="container mt-3">
          <div class="card schedule-card">
            <ul class="list-group list-group-flush">
              <li class="list-group-item small py-2">
                <div class="row">
                  <div class="col-3 text-nowrap small">9:00 AM</div>
                  <div class="col-5">Study WEBPROG</div>
                  <div class="col-4">
                    <span class="badge text-bg-primary">School</span>
                  </div>
                </div>
              </li>

              <li class="list-group-item small py-2">
                <div class="row">
                  <div class="col-3 text-nowrap small">11:00 AM</div>
                  <div class="col-5">Use Bootstrap</div>
                  <div class="col-4">
                    <span class="badge text-bg-danger">Work</span>
                  </div>
                </div>
              </li>

              <li class="list-group-item small py-2">
                <div class="row">
                  <div class="col-3 text-nowrap small">2:00 PM</div>
                  <div class="col-5">Rest</div>
                  <div class="col-4">
                    <span class="badge text-bg-success">Personal</span>
                  </div>
                </div>
              </li>
            </ul>
          </div>
        </section>

        <!-- nav bar -->
        <section>
          <nav class="navbar bg-body-tertiary nav-styling">
            <div class="container-fluid">
              <a class="nav-link nav-item" href="Home.html">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
              </a>
              <a class="nav-link nav-item" href="Calendar.html">
                <i class="fa-regular fa-calendar"></i>
                <span>Calendar</span>
              </a>
              <a class="nav-link nav-item active" href="Task.html">
                <i class="fa-regular fa-square-check"></i>
                <span>Task list</span>
              </a>
              <a class="nav-link nav-item" href="Settings.html">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
              </a>
            </div>
          </nav>
        </section>
        <button
          class="btn btn-add rounded-circle"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#staticBackdrop"
          aria-controls="staticBackdrop"
        >
          <i class="fa-solid fa-plus fs-5 add-task"></i>
        </button>

        <div
          class="offcanvas offcanvas-bottom task-sheet"
          data-bs-backdrop="false"
          tabindex="-1"
          id="staticBackdrop"
          aria-labelledby="staticBackdropLabel"
        >
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="staticBackdropLabel">New Task</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <div class="offcanvas-body">
            <div class="container text-center">
              <div class="row g-2">
                <div class="col">
                  <!-- Title and Description -->
                  <h2 style="font-size: 16px; text-align: left">Title</h2>
                  <input
                    type="text"
                    class="rounded-pill details"
                    name="Taskname"
                    placeholder="Task Name"
                    required
                  />
                  <h2 style="font-size: 16px; text-align: left">
                    Description (Optional)
                  </h2>
                  <input
                    type="text"
                    class="rounded-pill details"
                    name="Taskname"
                    placeholder="Details about the task"
                    required
                  />
                  <!-- Category Dropdown for tasks -->
                  <h2 style="font-size: 16px; text-align: left">Category</h2>
                  <select
                    class="form-select"
                    aria-label="Default select example"
                  >
                    <option selected>School</option>
                    <option value="1">Work</option>
                    <option value="2">Personal</option>
                  </select>
                  <!-- Date and Time -->
                  <div class="row g-2 mt-1">
                    <div class="col-6">
                      <h2 style="font-size: 16px; text-align: left">Date</h2>
                      <input type="date" class="form-control rounded-pill" />
                    </div>
                    <div class="col-6">
                      <h2 style="font-size: 16px; text-align: left">Time</h2>
                      <input type="time" class="form-control rounded-pill" />
                    </div>
                  </div>
                  <!-- Buttons -->
                  <div class="d-flex justify-content-between mt-3">
                    <button
                      type="button"
                      class="btn btn-primary"
                      style="
                        background-color: #2f6fb0;
                        border-radius: 30px;
                        height: 40px;
                        width: 80px;
                        font-size: 12px;
                        margin-left: 15px;
                      "
                      data-bs-dismiss="offcanvas"
                    >
                      Cancel
                    </button>
                    <button
                      type="button"
                      class="btn btn-primary"
                      style="
                        background-color: #2f6fb0;
                        border-radius: 30px;
                        height: 40px;
                        width: 80px;
                        font-size: 12px;
                        margin-right: 15px;
                      "
                      data-bs-dismiss="offcanvas"
                    >
                      Add Task
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
