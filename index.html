<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Styling.css" />
  </head>

  <body class="defaultbg">
    <div class="phone-frame">
      <div class="phone-screen">
        <img src="images/Applogo.jpg" alt="Logo" class="logo" />
        <h2 class="fs-5">Welcome to</h2>
        <h1 class="fs-1 text-center">Task Flow</h1>

        <!-- Login form -->

        <form action="Home.html" method="GET">
          <input
            type="text"
            class="form-control details"
            name="username"
            placeholder="Please Enter Your Username"
            required
          />
          <input
            class="form-control details"
            type="password"
            placeholder="Please Enter Your Password"
            required
          />

          <button class="buttondsgn" type="submit">Login</button>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
