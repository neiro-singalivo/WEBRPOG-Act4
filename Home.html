<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="Styling.css" />
  </head>
  <body class="defaultbg">
    <div class="phone-frame">
      <div class="phone-screen">
        <h1
          style="
            color: white;
            margin-top: 20px;
            margin-left: 20px;
            font-size: 25px;
          "
        >
          Hello, User
        </h1>
        <div class="container text-center">
          <div class="row g-2">
            <div class="col">
              <div class="card col-style h-100">
                <div class="card-body p-2 col-height">
                  <h2 class="fw-bold mb-0">3</h2>
                  <small>Tasks</small>
                </div>
              </div>
            </div>

            <div class="col">
              <div class="card col-style h-100">
                <div class="card-body p-2 col-height">
                  <h2 class="fw-bold mb-0">4</h2>
                  <small>Tasks done</small>
                </div>
              </div>
            </div>

            <div class="col">
              <div class="card col-style h-100">
                <div class="card-body p-2 col-height">
                  <h2 class="fw-bold mb-0">0</h2>
                  <small>Conflicts</small>
                </div>
              </div>
            </div>
          </div>
        </div>
        <section class="container mt-3">
          <div class="card schedule-card">
            <div class="card-header schedule-title fw-bold">Daily Schedule</div>
            <div class="card-header sched-category fw-bold">
              <div class="row">
                <div class="col-3" style="font-size: 11.5px">Time</div>
                <div class="col-5" style="font-size: 11.5px">Activity</div>
                <div class="col-4" style="font-size: 11.5px">Category</div>
              </div>
            </div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item small py-2">
                <div class="row">
                  <div class="col-3 text-nowrap small">9:00 AM</div>
                  <div class="col-5">Study WEBPROG</div>
                  <div class="col-4">
                    <span class="badge text-bg-primary">School</span>
                  </div>
                </div>
              </li>

              <li class="list-group-item small py-2">
                <div class="row">
                  <div class="col-3 text-nowrap small">11:00 AM</div>
                  <div class="col-5">Use Bootstrap</div>
                  <div class="col-4">
                    <span class="badge text-bg-danger">School</span>
                  </div>
                </div>
              </li>

              <li class="list-group-item small py-2">
                <div class="row">
                  <div class="col-3 text-nowrap small">2:00 PM</div>
                  <div class="col-5">Rest</div>
                  <div class="col-4">
                    <span class="badge text-bg-success">Personal</span>
                  </div>
                </div>
              </li>
            </ul>
          </div>
        </section>
        <section>
          <nav class="navbar bg-body-tertiary nav-styling">
            <div class="container-fluid">
              <a class="nav-link nav-item active" href="Home.html">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
              </a>
              <a class="nav-link nav-item" href="Calendar.html">
                <i class="fa-regular fa-calendar"></i>
                <span>Calendar</span>
              </a>
              <a class="nav-link nav-item" href="Task.html">
                <i class="fa-regular fa-square-check"></i>
                <span>Task list</span>
              </a>
              <a class="nav-link nav-item" href="Settings.html">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
              </a>
            </div>
          </nav>
        </section>
        <section class="container mt-2">
          <div class="card schedule-card" style="margin-top: 20px">
            <div class="card-header schedule-title text-center py-2">
              Coming Soon
            </div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item text-center text-secondary small py-2">
                Nothing scheduled beyond today yet.
              </li>
            </ul>
          </div>
        </section>
        <a href="Task.html" class="btn btn-add rounded-circle">
          <i class="fa-solid fa-plus fs-5 add-task"></i>
        </a>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
