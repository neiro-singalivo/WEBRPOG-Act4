<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="Styling.css" />
  </head>

  <body class="defaultbg">
    <div class="phone-frame">
      <div class="phone-screen">
        <h1
          style="
            color: white;
            margin-top: 20px;
            margin-left: 20px;
            font-size: 25px;
          "
        >
          Calendar
        </h1>
        <section class="px-2 mt-3">
          <div
            id="carouselExample"
            class="carousel slide"
            data-bs-interval="false"
          >
            <div class="carousel-inner">
              <div class="carousel-item active">
                <div
                  class="cal-head d-flex justify-content-between align-items-center text-white mb-2"
                >
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="prev"
                  >
                    <i class="fa-solid fa-chevron-left"></i>
                  </button>
                  <h5 class="m-0 fw-bold">November 2026</h5>
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="next"
                  >
                    <i class="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
                <div class="cal-wrap">
                  <img
                    src="images/November.png"
                    class="cal-img"
                    alt="November 2026"
                    height="200"
                    width="280"
                  />
                </div>
              </div>
              <div class="carousel-item">
                <div
                  class="cal-head d-flex justify-content-between align-items-center text-white mb-2"
                >
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="prev"
                  >
                    <i class="fa-solid fa-chevron-left"></i>
                  </button>
                  <h5 class="m-0 fw-bold">December 2026</h5>
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="next"
                  >
                    <i class="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
                <div class="cal-wrap">
                  <img
                    src="images/December.png"
                    class="cal-img"
                    alt="December 2026"
                    height="200"
                    width="280"
                  />
                </div>
              </div>
              <div class="carousel-item">
                <div
                  class="cal-head d-flex justify-content-between align-items-center text-white mb-2"
                >
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="prev"
                  >
                    <i class="fa-solid fa-chevron-left"></i>
                  </button>
                  <h5 class="m-0 fw-bold">January 2027</h5>
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="next"
                  >
                    <i class="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
                <div class="cal-wrap">
                  <img
                    src="images/January.png"
                    class="cal-img"
                    alt="January 2026"
                    height="200"
                    width="280"
                  />
                </div>
              </div>
              <div class="carousel-item">
                <div
                  class="cal-head d-flex justify-content-between align-items-center text-white mb-2"
                >
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="prev"
                  >
                    <i class="fa-solid fa-chevron-left"></i>
                  </button>
                  <h5 class="m-0 fw-bold">February 2027</h5>
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="next"
                  >
                    <i class="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
                <div class="cal-wrap">
                  <img
                    src="images/February.png"
                    class="cal-img"
                    alt="February 2027"
                    height="200"
                    width="280"
                  />
                </div>
              </div>
            </div>
          </div>
        </section>
        <section>
          <nav class="navbar bg-body-tertiary nav-styling">
            <div class="container-fluid">
              <a class="nav-link nav-item" href="Home.html">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
              </a>
              <a class="nav-link nav-item active" href="Calendar.html">
                <i class="fa-regular fa-calendar"></i>
                <span>Calendar</span>
              </a>
              <a class="nav-link nav-item" href="Task.html">
                <i class="fa-regular fa-square-check"></i>
                <span>Task list</span>
              </a>
              <a class="nav-link nav-item" href="Settings.html">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
              </a>
            </div>
          </nav>
        </section>

        <section class="container mt-2">
          <div class="card schedule-card" style="margin-top: 20px">
            <div
              class="card-header schedule-title py-2"
              style="background-color: white; color: #1b2e3d; font-size: 11.5px"
            >
              <b>Wednesday, 18 November</b>
            </div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item text-center text-secondary small py-2">
                3 events today
              </li>
            </ul>
          </div>
        </section>
        <button
          class="btn btn-add rounded-circle"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#staticBackdrop"
          aria-controls="staticBackdrop"
        >
          <i class="fa-solid fa-plus fs-5 add-task"></i>
        </button>

        <div
          class="offcanvas offcanvas-bottom task-sheet"
          data-bs-backdrop="false"
          tabindex="-1"
          id="staticBackdrop"
          aria-labelledby="staticBackdropLabel"
        >
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="staticBackdropLabel">New Task</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <div class="offcanvas-body">
            <div class="container text-center">
              <div class="row g-2">
                <div class="col">
                  <h2 style="font-size: 16px; text-align: left">Title</h2>
                  <input
                    type="text"
                    class="rounded-pill details"
                    name="Taskname"
                    placeholder="Task Name"
                    required
                  />
                  <h2 style="font-size: 16px; text-align: left">
                    Description (Optional)
                  </h2>
                  <input
                    type="text"
                    class="rounded-pill details"
                    name="Taskname"
                    placeholder="Details about the task"
                    required
                  />
                  <h2 style="font-size: 16px; text-align: left">Category</h2>
                  <select
                    class="form-select"
                    aria-label="Default select example"
                  >
                    <option selected>School</option>
                    <option value="1">Work</option>
                    <option value="2">Personal</option>
                  </select>
                  <div class="row g-2 mt-1">
                    <div class="col-6">
                      <h2 style="font-size: 16px; text-align: left">Date</h2>
                      <input type="date" class="form-control rounded-pill" />
                    </div>
                    <div class="col-6">
                      <h2 style="font-size: 16px; text-align: left">Time</h2>
                      <input type="time" class="form-control rounded-pill" />
                    </div>
                  </div>
                  <div class="d-flex justify-content-between mt-3">
                    <button
                      type="button"
                      class="btn btn-primary"
                      style="
                        background-color: #2f6fb0;
                        border-radius: 30px;
                        height: 40px;
                        width: 80px;
                        font-size: 12px;
                        margin-left: 15px;
                      "
                      data-bs-dismiss="offcanvas"
                    >
                      Cancel
                    </button>
                    <button
                      type="button"
                      class="btn btn-primary"
                      style="
                        background-color: #2f6fb0;
                        border-radius: 30px;
                        height: 40px;
                        width: 80px;
                        font-size: 12px;
                        margin-right: 15px;
                      "
                      data-bs-dismiss="offcanvas"
                    >
                      Add Task
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
