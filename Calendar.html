<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="Styling.css" />
  </head>

  <body class="defaultbg">
    <div class="phone-frame">
      <div class="phone-screen">
        <h1
          style="
            color: white;
            margin-top: 20px;
            margin-left: 20px;
            font-size: 25px;
          "
        >
          Calendar
        </h1>
        <section class="container mt-3">
          <div
            id="carouselExample"
            class="carousel slide"
            data-bs-interval="false"
          >
            <div class="carousel-inner">
              <div class="carousel-item active">
                <div
                  class="cal-head d-flex justify-content-between align-items-center text-white mb-2"
                >
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="prev"
                  >
                    <i class="fa-solid fa-chevron-left"></i>
                  </button>
                  <h5 class="m-0 fw-bold">November 2026</h5>
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="next"
                  >
                    <i class="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
                <div class="cal-wrap">
                  <img
                    src="images/November.png"
                    class="cal-img"
                    alt="November 2026"
                    height="100%"
                    width="100%"
                  />
                </div>
              </div>
              <div class="carousel-item">
                <div
                  class="cal-head d-flex justify-content-between align-items-center text-white mb-2"
                >
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="prev"
                  >
                    <i class="fa-solid fa-chevron-left"></i>
                  </button>
                  <h5 class="m-0 fw-bold">December 2026</h5>
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="next"
                  >
                    <i class="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
                <div class="cal-wrap">
                  <img
                    src="images/December.png"
                    class="cal-img"
                    alt="December 2026"
                    height="100%"
                    width="100%"
                  />
                </div>
              </div>
              <div class="carousel-item">
                <div
                  class="cal-head d-flex justify-content-between align-items-center text-white mb-2"
                >
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="prev"
                  >
                    <i class="fa-solid fa-chevron-left"></i>
                  </button>
                  <h5 class="m-0 fw-bold">January 2027</h5>
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="next"
                  >
                    <i class="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
                <div class="cal-wrap">
                  <img
                    src="images/January.png"
                    class="cal-img"
                    alt="January 2026"
                    height="100%"
                    width="100%"
                  />
                </div>
              </div>
              <div class="carousel-item">
                <div
                  class="cal-head d-flex justify-content-between align-items-center text-white mb-2"
                >
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="prev"
                  >
                    <i class="fa-solid fa-chevron-left"></i>
                  </button>
                  <h5 class="m-0 fw-bold">February 2027</h5>
                  <button
                    class="btn text-white"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="next"
                  >
                    <i class="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
                <div class="cal-wrap">
                  <img
                    src="images/February.png"
                    class="cal-img"
                    alt="February 2027"
                    height="100%"
                    width="100%"
                  />
                </div>
              </div>
            </div>
          </div>
        </section>
        <section>
          <nav class="navbar bg-body-tertiary nav-styling">
            <div class="container-fluid">
              <a class="nav-link nav-item" href="Home.html">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
              </a>
              <a class="nav-link nav-item active" href="Calendar.html">
                <i class="fa-regular fa-calendar"></i>
                <span>Calendar</span>
              </a>
              <a class="nav-link nav-item" href="Task.html">
                <i class="fa-regular fa-square-check"></i>
                <span>Task list</span>
              </a>
              <a class="nav-link nav-item" href="Settings.html">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
              </a>
            </div>
          </nav>
        </section>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
