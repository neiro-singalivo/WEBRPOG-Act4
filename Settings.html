<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="Styling.css" />
  </head>
  <body class="defaultbg">
    <div class="phone-frame">
      <div class="phone-screen">
        <h1
          style="
            color: white;
            margin-top: 20px;
            margin-left: 20px;
            font-size: 25px;
          "
        >
          Settings
        </h1>

        <div class="profile-layout">
          <i class="fa-solid fa-user profile rounded-circle"></i>
          <div class="profile-info">
            <h1
              style="
                color: white;
                margin: 0;
                font-size: 18px;
              "
            >
              User
            </h1>
            <p
              style="
                margin: 2px 0 0;
                font-size: 13px;
                color: #d7e4f2;
                opacity: 0.75;
              "
            >
              This is your user profile.
            </p>
            <div class="profile-actions">
              <p style="color: white; font-size: 8px">Change Photo</p>
              <p style="color: white; font-size: 8px">Change username</p>
            </div>
          </div>
        </div>
        <!-- nav bar -->
        <section>
          <nav class="navbar bg-body-tertiary nav-styling">
            <div class="container-fluid">
              <a class="nav-link nav-item" href="Home.html">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
              </a>
              <a class="nav-link nav-item" href="Calendar.html">
                <i class="fa-regular fa-calendar"></i>
                <span>Calendar</span>
              </a>
              <a class="nav-link nav-item" href="Task.html">
                <i class="fa-regular fa-square-check"></i>
                <span>Task list</span>
              </a>
              <a class="nav-link nav-item active" href="Settings.html">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
              </a>
            </div>
          </nav>
        </section>
        <a href="Task.html" class="btn btn-add rounded-circle">
          <i class="fa-solid fa-plus fs-5 add-task"></i>
        </a>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
